services:
  bridge-psr3-8.1:
    container_name: bridge-psr3-8.1
    hostname: bridge-psr3-81
    build:
      dockerfile: resources/docker/develop/Dockerfile
      args:
        PHP_VERSION: 8.1
    working_dir: /srv
    volumes:
      - .:/srv
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bridge-psr3-8.2:
    container_name: bridge-psr3-8.2
