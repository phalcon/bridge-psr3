name: "Bridge PSR-3 CI"

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: "Code quality (phpcs + phpstan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          tools: composer:v2
          coverage: none

      - name: "Install dependencies"
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: "PHPCS"
        run: composer cs

      - name: "PHPStan"
        run: composer analyze

  tests:
    name: "Tests / PHP ${{ matrix.php }} / ${{ matrix.backend }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        backend: ['package', 'ext']
    steps:
      - uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer:v2, pie
          coverage: xdebug

      # cphalcon C-extension backend, installed with PIE (PECL is deprecated).
      # Run PIE as root: installing/enabling the extension writes to system PHP
      # paths, and PIE refuses to self-elevate via sudo in CI's non-interactive shell.
      - name: "Install cphalcon via PIE"
        if: matrix.backend == 'ext'
        run: sudo $(which pie) install phalcon/cphalcon

      - name: "Validate composer"
        run: composer validate --no-check-all --no-check-publish

      - name: "Install dependencies"
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: "Run unit tests"
        run: composer test-unit

  coverage:
    name: "Coverage → Codecov"
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          tools: composer:v2
          coverage: xdebug

      - name: "Install dependencies"
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: "Generate coverage (clover)"
        run: composer test-coverage-clover

      - name: "Upload to Codecov"
        uses: codecov/codecov-action@v4
        with:
          files: tests/support/output/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
